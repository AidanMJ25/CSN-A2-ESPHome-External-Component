esphome:
  name: qr701-printer

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# QR701 TTL variant: use a regulated 9 V, 2–3 A supply and share GND with the
# ESP. TX is sufficient for printing; leave printer TX and DTR disconnected.
# The documented QR701 TTL default is 19,200 baud; try 9,600 if this unit does
# not print correctly.
uart:
  id: printer_uart
  tx_pin: GPIO17
  # rx_pin is optional; do not connect printer TX to a 3.3 V ESP without
  # confirming the printer's output level or using a level shifter.
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1

external_components:
  - source:
      type: local
      path: components
    components: [qr701]

qr701:
  id: receipt_printer
  uart_id: printer_uart

button:
  - platform: template
    name: Print test receipt
    on_press:
      - qr701.print: |-
          Hello from ESPHome!
          This is a test receipt.
