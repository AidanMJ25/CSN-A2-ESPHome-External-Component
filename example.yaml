esphome:
  name: qr701-printer

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# QR701 TTL variant: use a regulated 9 V, 2–3 A supply and share GND with the
# ESP. Connect printer TX for status reporting; leave DTR disconnected.
# The documented QR701 TTL default is 19,200 baud; try 9,600 if this unit does
# not print correctly.
uart:
  id: printer_uart
  tx_pin: GPIO17
  # Do not connect printer TX to a 3.3 V ESP without confirming its output
  # level or using a level shifter.
  rx_pin: GPIO16
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1

external_components:
  - source:
      type: local
      path: components
    components: [qr701]

qr701:
  id: receipt_printer
  uart_id: printer_uart
  # A writable Home Assistant text field. Setting its value prints one receipt.
  # Newlines are preserved; the field clears after the job is submitted.
  print_text:
    name: Print QR701 text
  status:
    name: QR701 status
  paper_out:
    name: QR701 paper out
  cover_open:
    name: QR701 cover open
  error:
    name: QR701 error

button:
  - platform: template
    name: Feed QR701 paper
    on_press:
      - qr701.feed: 3
  - platform: template
    name: Refresh QR701 status
    on_press:
      - qr701.refresh_status:
          id: receipt_printer
  - platform: template
    name: Print test receipt
    on_press:
      - qr701.print_text: |-
          Hello from ESPHome!
          This is a test receipt.
